name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel any in-progress run on the same ref when a new commit lands —
# saves time when iterating on a PR via force-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: turbovec test suite
        run: cargo test -p turbovec --release --locked

      # Standalone cargo project that path-deps turbovec — exercises the
      # same link path a downstream `cargo add turbovec` user hits. Since
      # turbovec 0.10.0 (format v5) the crate has no native/BLAS dependency,
      # so this must build and run with zero extra setup.
      - name: Downstream consumer smoke test
        run: cargo run --release --locked --manifest-path examples/downstream-smoke/Cargo.toml

  # Cross-OS encode fingerprint (#259). The v5 rotation is deterministic
  # by construction and the per-vector norm now has a frozen reduction
  # order, but the Lloyd-Max codebook still goes through `statrs` Beta
  # cdf/pdf — transcendentals, the same cross-libm class as #206's second
  # finding — and that can only be checked by comparing bytes produced on
  # different platforms. This leg is that check.
  #
  # Each OS runs `examples/encode_hash` (deterministic LCG input, six
  # (dim, bit_width) cells) and uploads its output; the compare job below
  # fails unless every OS produced the same lines. The per-stage split —
  # codebook / calibration / codes / scales / file — means a divergence
  # names the stage that drifted instead of just "the bytes differ".
  encode-fingerprint:
    name: Encode fingerprint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute encode fingerprint
        shell: bash
        run: |
          cargo run --release --locked -p turbovec --example encode_hash \
            > "fingerprint-${{ matrix.os }}.txt"
          cat "fingerprint-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint-${{ matrix.os }}.txt

  encode-fingerprint-compare:
    name: Encode fingerprint agrees across OSes
    runs-on: ubuntu-latest
    needs: encode-fingerprint
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: fingerprints

      - name: All OSes must agree
        shell: bash
        run: |
          set -euo pipefail
          files=$(find fingerprints -name 'fingerprint-*.txt' | sort)
          echo "Comparing:"; echo "$files"
          # Normalize line endings — the Windows leg writes CRLF.
          for f in $files; do tr -d '\r' < "$f" > "$f.norm"; done
          distinct=$(md5sum $(for f in $files; do echo "$f.norm"; done) \
                     | awk '{print $1}' | sort -u | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "::error::encode output differs across platforms"
            echo "--- per-OS fingerprints ---"
            for f in $files; do echo "== $f"; cat "$f.norm"; done
            echo
            echo "The differing column names the stage that drifted."
            echo "A 'codebook' difference is the known-open half of #259:"
            echo "the Lloyd-Max codebook is computed from statrs Beta"
            echo "cdf/pdf, so the fix is to precompute and pin it."
            exit 1
          fi
          echo "All platforms agree:"
          cat "$(echo "$files" | head -1).norm"

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install maturin and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Build turbovec wheel
        shell: bash
        working-directory: turbovec-python
        run: maturin build --release --locked --out dist

      # Install the freshly-built wheel + the four integration extras so the
      # haystack / langchain / llama-index / agno test files run instead of
      # being skipped by their `pytest.importorskip(...)` guards.
      - name: Install wheel + integration extras
        shell: bash
        working-directory: turbovec-python
        run: |
          python -m pip install dist/*.whl
          python -m pip install \
            "langchain-core>=0.3" \
            "llama-index-core>=0.11" \
            "haystack-ai>=2.0" \
            "agno>=2.0"

      # Fork-safety gate (issue #147). rayon's pool does not survive fork();
      # the child must detect the fork and rebuild it. This behavior is
      # glibc/futex-specific and macOS (psynch pthreads, spawn-default) cannot
      # validate it — the ubuntu leg of this matrix is the real gate. Run it as
      # an explicit, named step so a fork regression is unmistakable in the log
      # (the full pytest run below also includes these tests). On Windows the
      # fork-only cases skip themselves (no os.fork).
      #
      # NOTE: this exercises the CI runner's glibc (~2.35), not the oldest
      # shipped target (manylinux2014 / glibc 2.17). The authoritative fork
      # detector (os.register_at_fork) and the pthread_atfork backstop are
      # libc-version-independent, and getpid is only a tertiary confirm, so
      # 2.17 is expected to behave identically — but see the PR notes: an
      # oldest-glibc container run is still recommended before release.
      - name: Fork-safety tests (#147 gate)
        shell: bash
        run: pytest turbovec-python/tests/test_fork_safety.py -v

      - name: Run pytest
        shell: bash
        run: pytest turbovec-python/tests/ -v
