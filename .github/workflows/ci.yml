name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel any in-progress run on the same ref when a new commit lands —
# saves time when iterating on a PR via force-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Require the AVX2 kernels to actually execute rather than be
      # skipped. The identity tests check every SIMD path the host can
      # run and silently skip the rest, so without this a runner that
      # lacks a feature exercises nothing and still reports green — the
      # absence of coverage is invisible. Every GitHub-hosted x86 runner
      # has AVX2, so this is free; on macos-14 (arm64) the gate compiles
      # to a no-op.
      #
      # AVX-512 is deliberately NOT listed: GitHub-hosted runners are not
      # guaranteed to have it, so requiring it here would fail honest
      # builds. Those kernels stay single-machine-verified until a
      # designated runner or an Intel SDE leg covers them.
      - name: turbovec test suite
        env:
          TURBOVEC_REQUIRE_SIMD: avx2
        run: cargo test -p turbovec --release --locked

      # Standalone cargo project that path-deps turbovec — exercises the
      # same link path a downstream `cargo add turbovec` user hits. Since
      # turbovec 0.10.0 (format v5) the crate has no native/BLAS dependency,
      # so this must build and run with zero extra setup.
      - name: Downstream consumer smoke test
        run: cargo run --release --locked --manifest-path examples/downstream-smoke/Cargo.toml

  # `debug_assert!` was invisible infrastructure until now: ci.yml and
  # release-crates.yml both ran `--release` only, so all 15 of the
  # `debug_assert!`s in turbovec/src — the block-alignment and buffer-length
  # invariants guarding the SIMD rotation, pack and search kernels — never
  # executed in CI (#306). Debug also removes the release build's overflow
  # elision, so integer overflow in index arithmetic panics here instead of
  # wrapping silently.
  #
  # Ubuntu only, and one suite short of the full set. Measured on an M-series
  # host with a warm target dir, every debug test binary runs in single-digit
  # to low-tens of seconds — 115s for all nineteen of them combined — with one
  # exception: `io_v6` alone did not finish inside 420s. Every v5/v6 load
  # recomputes the Lloyd-Max codebook (io.rs `validate_codebook`), that solve
  # is unmemoized (#357/#368) and it is orders of magnitude slower
  # unoptimized, so the suite that does the most loads dominates everything.
  # It contains no `debug_assert!`-carrying code of its own — the asserts live
  # in pack.rs, rotation.rs, search.rs, id_map.rs and lib.rs — so excluding it
  # costs no assert coverage and keeps this leg at ~2 minutes of test time.
  # Drop the exclusion if the codebook solve is ever memoized.
  #
  # The target list is computed by *excluding* io_v6 rather than by listing
  # the suites to include, so a new file in turbovec/tests is picked up
  # automatically instead of being silently skipped.
  rust-debug:
    name: Rust (debug profile, debug_assert! enabled)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: turbovec debug tests (all suites except io_v6)
        shell: bash
        env:
          TURBOVEC_REQUIRE_SIMD: avx2
        run: |
          set -euo pipefail
          args=()
          for f in turbovec/tests/*.rs; do
            name=$(basename "$f" .rs)
            [ "$name" = "io_v6" ] && continue
            args+=(--test "$name")
          done
          echo "debug suites: ${args[*]}"
          cargo test -p turbovec --locked --lib "${args[@]}"

  # `cargo fmt --check` is deliberately NOT part of this job. On unmodified
  # `origin/main`, rustfmt 1.8.0-stable reports 309 diff hunks across 33
  # files — pre-existing formatting drift, not anything this PR introduced.
  # Adding the check would fail every PR from the moment it merged, and
  # reformatting the tree to fix that would bury a 33-file mechanical diff
  # inside a CI change and rewrite the blame on every hot file in the crate.
  # It belongs in its own PR, alongside a pinned rustfmt version so the drift
  # cannot silently recur.
  #
  # No workflow ran clippy at all (#306). It cannot be turned on wholesale:
  # `origin/main` carries 81 distinct clippy findings today, so `-D warnings`
  # would fail every PR on day one. Fixing them is a separate change — this
  # PR adds no production edits — so the currently-triggered lints are
  # allow-listed by name below and everything else is denied.
  #
  # That makes this a ratchet rather than a rubber stamp: any lint *class*
  # not already present in the tree fails the build, which is where the
  # value is (all of clippy::correctness bar `redundant_locals` is clean).
  # The allow-list is the debt list. Deleting a line from it and fixing the
  # findings behind it is a good standalone PR; nothing should ever be added
  # to it without a note saying why.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: rustup component add clippy

      # Counts are from `origin/main` at the time this leg was added; they
      # are there so a reviewer can see the size of each debt at a glance.
      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- \
            -D warnings \
            -A clippy::needless_range_loop \
            -A clippy::manual_is_multiple_of \
            -A clippy::useless_vec \
            -A clippy::too_many_arguments \
            -A clippy::manual_div_ceil \
            -A clippy::unusual_byte_groupings \
            -A clippy::empty_line_after_doc_comments \
            -A clippy::type_complexity \
            -A clippy::items_after_test_module \
            -A clippy::neg_cmp_op_on_partial_ord \
            -A clippy::redundant_locals \
            -A clippy::manual_repeat_n \
            -A clippy::ptr_arg \
            -A clippy::doc_lazy_continuation \
            -A clippy::explicit_counter_loop \
            -A clippy::excessive_precision \
            -A clippy::len_zero \
            -A unused_mut \
            -A unused_imports
          # Pre-existing debt allowed above, by count on origin/main:
          #   24 needless_range_loop      9 manual_is_multiple_of
          #    7 useless_vec              6 too_many_arguments
          #    6 manual_div_ceil          4 unusual_byte_groupings
          #    3 empty_line_after_doc_comments
          #    3 type_complexity          3 items_after_test_module
          #    2 neg_cmp_op_on_partial_ord
          #    2 redundant_locals         2 manual_repeat_n
          #    2 ptr_arg                  2 unused_mut
          #    2 unused_imports           1 doc_lazy_continuation
          #    1 explicit_counter_loop    1 excessive_precision
          #    1 len_zero

  # The declared MSRV has been wrong twice (1.70 -> 1.83 -> 1.89, the
  # latter because the AVX-512 search kernel needs intrinsics stabilized
  # in 1.89 while the manifest still said 1.83). Both times it was found
  # by hand. This leg reads `rust-version` straight out of the manifest
  # and builds with exactly that toolchain, so the number cannot drift
  # away from reality again without CI saying so.
  msrv:
    name: MSRV (declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read declared MSRV
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' turbovec/Cargo.toml | cut -d'"' -f2)
          py=$(grep -m1 '^rust-version' turbovec-python/Cargo.toml | cut -d'"' -f2)
          if [ "$v" != "$py" ]; then
            echo "::error::turbovec declares MSRV $v but turbovec-python declares $py"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV: $v"

      - name: Install the declared toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - name: Build both packages on it
        run: |
          cargo +${{ steps.msrv.outputs.version }} check -p turbovec --locked --all-targets
          cargo +${{ steps.msrv.outputs.version }} check -p turbovec-python --locked

  # Cross-OS encode fingerprint (#259). The rotation is deterministic by
  # construction, the per-vector norm has a frozen reduction order, and
  # the codebook's boundaries are derived from its f32 centroids — but
  # the centroids themselves still come out of `statrs` Beta cdf/pdf,
  # whose `ln`/`exp` differ between libms. The f32 cast has ~5 orders of
  # magnitude of margin over any observed difference, which is strong
  # evidence and not a proof. This leg is what turns it into a check.
  #
  # Each OS runs `examples/encode_hash` (deterministic LCG input, six
  # (dim, bit_width) cells) and uploads its output; the compare job below
  # fails unless every OS produced the same lines. The per-stage split —
  # boundaries / centroids / calibration / codes / scales / file — means
  # a divergence names the stage that drifted instead of just "the bytes
  # differ". That split is what localized the original failure to the
  # boundary midpoints while everything downstream still agreed.
  encode-fingerprint:
    name: Encode fingerprint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute encode fingerprint
        shell: bash
        run: |
          cargo run --release --locked -p turbovec --example encode_hash \
            > "fingerprint-${{ matrix.os }}.txt"
          cat "fingerprint-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fingerprint-${{ matrix.os }}
          path: fingerprint-${{ matrix.os }}.txt

  encode-fingerprint-compare:
    name: Encode fingerprint agrees across OSes
    runs-on: ubuntu-latest
    needs: encode-fingerprint
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: fingerprints

      - name: All OSes must agree
        shell: bash
        run: |
          set -euo pipefail
          files=$(find fingerprints -name 'fingerprint-*.txt' | sort)
          echo "Comparing:"; echo "$files"
          # A comparison is only meaningful if every leg actually reported.
          # Without this, an artifact-name or path drift that leaves two
          # files instead of three still "agrees" — the check would rot
          # into a two-way comparison silently. Keep in sync with the
          # matrix above.
          expected=3
          found=$(printf '%s\n' "$files" | grep -c . || true)
          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected fingerprints, found $found"
            exit 1
          fi
          # Strip any CR before comparing. Rust's `println!` emits LF on
          # every platform, so this is belt-and-braces against an
          # artifact round-trip introducing them, not a Windows fix.
          for f in $files; do tr -d '\r' < "$f" > "$f.norm"; done
          distinct=$(md5sum $(for f in $files; do echo "$f.norm"; done) \
                     | awk '{print $1}' | sort -u | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "::error::encode output differs across platforms"
            echo "--- per-OS fingerprints ---"
            for f in $files; do echo "== $f"; cat "$f.norm"; done
            echo
            echo "The differing column names the stage that drifted."
            echo
            echo "boundaries/centroids: the Lloyd-Max codebook is computed"
            echo "  at runtime from statrs Beta cdf/pdf, so it is the stage"
            echo "  most exposed to a libm difference. Boundaries are"
            echo "  derived from the f32 centroids precisely so this cannot"
            echo "  happen (#259); a regression there is the first suspect."
            echo "codes/scales/calibration: a divergence here means an"
            echo "  encode kernel is not reproducing the scalar reference"
            echo "  on some target - check the per-path identity tests."
            exit 1
          fi
          echo "All platforms agree:"
          cat "$(echo "$files" | head -1).norm"

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install maturin and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Build turbovec wheel
        shell: bash
        working-directory: turbovec-python
        run: maturin build --release --locked --out dist

      # Install the freshly-built wheel + the four integration extras so the
      # haystack / langchain / llama-index / agno test files run instead of
      # being skipped by their `pytest.importorskip(...)` guards.
      - name: Install wheel + integration extras
        shell: bash
        working-directory: turbovec-python
        run: |
          python -m pip install dist/*.whl
          python -m pip install \
            "langchain-core>=0.3" \
            "llama-index-core>=0.11" \
            "haystack-ai>=2.0" \
            "agno>=2.0"

      # Fork-safety gate (issue #147). rayon's pool does not survive fork();
      # the child must detect the fork and rebuild it. This behavior is
      # glibc/futex-specific and macOS (psynch pthreads, spawn-default) cannot
      # validate it — the ubuntu leg of this matrix is the real gate. Run it as
      # an explicit, named step so a fork regression is unmistakable in the log
      # (the full pytest run below also includes these tests). On Windows the
      # fork-only cases skip themselves (no os.fork).
      #
      # NOTE: this exercises the CI runner's glibc (~2.35), not the oldest
      # shipped target (manylinux2014 / glibc 2.17). The authoritative fork
      # detector (os.register_at_fork) and the pthread_atfork backstop are
      # libc-version-independent, and getpid is only a tertiary confirm, so
      # 2.17 is expected to behave identically — but see the PR notes: an
      # oldest-glibc container run is still recommended before release.
      - name: Fork-safety tests (#147 gate)
        shell: bash
        run: pytest turbovec-python/tests/test_fork_safety.py -v

      - name: Run pytest
        shell: bash
        run: pytest turbovec-python/tests/ -v

  # pyproject.toml promises `haystack-ai>=2.23.0` and `agno>=2.5.4`, but the
  # matrix above installs `>=2.0` for both and pip resolves that to the newest
  # release — so the floors users are told to trust have never once been
  # executed (#306). This leg installs each extra at exactly its declared
  # floor and runs the four integration suites against it.
  #
  # The pins are derived from pyproject rather than copied here, so raising a
  # floor automatically moves what CI tests and the two cannot drift apart.
  # ubuntu-only: a floor is a dependency-resolution property, not a platform
  # one, so a three-OS matrix would buy nothing for three times the build.
  integration-floors:
    name: Integration extras at their declared floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install maturin and pytest
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest

      - name: Build turbovec wheel
        shell: bash
        working-directory: turbovec-python
        run: maturin build --release --locked --out dist

      - name: Install wheel + extras pinned to their declared floors
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install turbovec-python/dist/*.whl
          floors=$(python3 .github/scripts/dep_floors.py)
          echo "Declared floors:"; echo "$floors"
          # No --upgrade: these are exact `==` pins, so a resolver that
          # cannot satisfy one fails here rather than quietly moving up.
          python -m pip install $floors
          python -m pip list | grep -Ei 'agno|haystack|langchain|llama-index'

      # Named explicitly rather than running the whole suite: if an extra
      # fails to install, its tests would `importorskip` away and the leg
      # would pass having tested nothing.
      - name: Integration suites against the floors
        shell: bash
        run: |
          # One deselection, not a suite exclusion. Turning this leg on for the
          # first time immediately found that the declared
          # `llama-index-core>=0.11` floor is not actually supported: at
          # 0.11.0 the field is spelled `metadata_seperator` (the upstream
          # typo), so the node round-trip test fails. That is a real bug in
          # the declaration, filed as #386, and fixing it is a user-visible
          # packaging change that belongs in its own PR — not something to
          # paper over here. Deselecting the single failing test keeps the
          # other 380-odd assertions gating the floor. Remove this line when
          # #386 lands. (`-k` rather than `--deselect`: pytest resolves
          # --deselect node ids against its rootdir, which is turbovec-python
          # here, so the repo-root-relative path silently matches nothing.)
          pytest -v -ra \
            -k "not test_query_returns_node_with_full_field_fidelity" \
            turbovec-python/tests/test_haystack.py \
            turbovec-python/tests/test_agno.py \
            turbovec-python/tests/test_langchain.py \
            turbovec-python/tests/test_llama_index.py
