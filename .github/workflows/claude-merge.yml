name: Claude Merge

# Owner-instructed merge that waives the CODEOWNERS review requirement.
#
# Deliberately minimal and ISOLATED from the @claude workflow: no Claude, no
# checkout, no build, no arbitrary shell — just a deterministic `gh pr merge`.
# You explicitly command each merge; nothing is decided by an LLM, and only the
# repo owner can trigger it. It waives the human review, NOT CI: required checks
# must be green first.
#
# The bypass power comes from a dedicated GitHub App (a named bypass actor on
# the `main` ruleset), NOT a personal admin PAT:
#   - Its ceiling is Contents + Pull requests: write — it can never touch
#     settings, secrets, or rulesets, even if the key leaks.
#   - Tokens are minted per-run and expire in ~an hour; nothing long-lived
#     sits next to a merge.
#   - Merges show up as the App's own identity in the audit log.
# One-time setup (see the PR description): create the App, install it with
# Contents + PRs: write, add it to the `main` ruleset bypass list, and set the
# MERGE_APP_ID / MERGE_APP_PRIVATE_KEY secrets.

on:
  issue_comment: # PR conversation comments
    types: [created]
  pull_request_review_comment: # inline code-review comments
    types: [created]
  pull_request_review: # review summary body
    types: [submitted]

permissions: {}

jobs:
  merge:
    # Owner only, "@claude merge" from any comment surface on a PR:
    # the conversation tab, an inline review comment, or a review summary.
    if: |
      github.actor_id == '10856497' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude merge')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude merge')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude merge'))
      )
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived installation token for the merge App.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}

      - name: Merge the PR (owner-instructed; waives review, keeps CI)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # issue_comment carries the PR as issue.number; the review events
          # carry it as pull_request.number.
          pr="${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event.pull_request.number }}"
          repo="${{ github.repository }}"
          # Waive the review, but require CI to be green first.
          if ! gh pr checks "$pr" -R "$repo" --required; then
            gh pr comment "$pr" -R "$repo" --body \
              "@${{ github.actor }} — not merging: required checks aren't green yet."
            exit 1
          fi
          # Bypasses the review requirement because the App is a ruleset bypass actor.
          gh pr merge "$pr" -R "$repo" --squash
          gh pr comment "$pr" -R "$repo" --body \
            "🚀 Merged on @${{ github.actor }}'s instruction — review requirement waived, CI was green."
