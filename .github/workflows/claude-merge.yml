name: Claude Merge Executor

# Isolated, privileged merge step. Fires when the `claude-merge` label is applied
# to a PR — either by the owner directly, or by the @claude agent when it judges
# the work ready. The agent only has Write-level powers (it can label but cannot
# bypass); THIS job does the actual review-waiving merge.
#
# Why pull_request_target + no checkout:
#   - The workflow definition is always taken from `main`, so a PR can't alter
#     this file to hijack the token.
#   - Secrets are available here, but fork PRs get none — so external PRs fail
#     safe (they simply can't be auto-merged).
#   - We NEVER check out or build PR code, so the App bypass token never sits
#     next to anything untrusted.
# It waives the human review, NOT CI: required checks must be green first.

on:
  # zizmor: ignore[dangerous-triggers] — intentional: base-branch workflow
  # definition + secrets, and we never check out or build PR code (see header).
  pull_request_target:
    types: [labeled]

permissions: {}

jobs:
  merge:
    # Fire only for the claude-merge label, applied by the owner (10856497) or
    # the turbovec-bot agent (309383466), on a PR authored by the owner or
    # dependabot. Anything else needs a human.
    if: |
      github.event.label.name == 'claude-merge' &&
      (github.event.sender.id == 10856497 || github.event.sender.id == 309383466) &&
      contains(fromJSON('["RyanCodrai", "dependabot[bot]"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      # Short-lived installation token for the merge App (a named bypass actor
      # on the main ruleset). Its ceiling is Contents + PRs: write.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGE_APP_ID }}
          private-key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}

      - name: Merge (waives review; keeps CI; refuses guardrail changes)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Passed via env (not inlined into the script) to avoid template
          # injection from user-controlled fields.
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BY: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          pr="$PR"
          repo="$REPO"
          by="$BY"

          # Guardrail lock: never auto-merge changes to the controls themselves.
          files="$(gh pr diff "$pr" -R "$repo" --name-only)"
          if echo "$files" | grep -qE '(^|/)CODEOWNERS$|^\.github/workflows/'; then
            gh pr comment "$pr" -R "$repo" --body \
              "🔒 Not auto-merging: this PR touches workflow/CODEOWNERS guardrails — merge it by hand."
            gh pr edit "$pr" -R "$repo" --remove-label claude-merge || true
            exit 1
          fi

          # Waive the review, but require CI green first. On failure, drop the
          # label so it can be re-applied to retry once checks pass.
          if ! gh pr checks "$pr" -R "$repo" --required; then
            gh pr comment "$pr" -R "$repo" --body \
              "⏳ Not merging yet: required checks aren't green. Re-apply the \`claude-merge\` label once they pass."
            gh pr edit "$pr" -R "$repo" --remove-label claude-merge || true
            exit 1
          fi

          gh pr merge "$pr" -R "$repo" --squash
          gh pr comment "$pr" -R "$repo" --body \
            "🚀 Auto-merged (review waived, CI green) — triggered by @${by}."
