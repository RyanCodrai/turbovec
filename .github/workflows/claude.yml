name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions: {}

jobs:
  claude:
    # Only the repo owner and the turbovec-bot machine account may invoke
    # @q-turbovec-bot — the OAuth token spends subscription usage, and this
    # workflow runs project code (cargo build/test) on trigger, so this guard
    # is load-bearing for security. Pinned to immutable numeric actor IDs
    # (RyanCodrai = 10856497, turbovec-bot = 309383466) rather than logins,
    # which can be renamed/reclaimed. turbovec-bot is allowed so a Claude run
    # can @q-turbovec-bot-mention follow-up work (e.g. request a review of its
    # own PR) and spawn a fresh agent; its PAT-authored comments do fire this
    # workflow, so keep the agent instructed to mention @q-turbovec-bot at
    # most once per run to bound chained invocations.
    if: |
      contains(fromJSON('["10856497", "309383466"]'), github.actor_id) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@q-turbovec-bot')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@q-turbovec-bot')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@q-turbovec-bot')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@q-turbovec-bot') || contains(github.event.issue.title, '@q-turbovec-bot')))
      )
    runs-on: ubuntu-latest
    # Write scopes so Claude can push branches, open PRs, and comment —
    # not just review. Matches the canonical claude-code-action example.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read # let Claude read CI results on PRs
    steps:
      # Acknowledge immediately with 👀 so the trigger is visibly "seen",
      # independent of whether Claude's run later succeeds or fails.
      - name: React 👀 (acknowledge)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const p = context.payload, o = context.repo.owner, r = context.repo.repo;
            const react = (fn, id, key) =>
              github.rest.reactions[fn]({ owner: o, repo: r, [key]: id, content: 'eyes' });
            try {
              if (context.eventName === 'issue_comment')
                await react('createForIssueComment', p.comment.id, 'comment_id');
              else if (context.eventName === 'pull_request_review_comment')
                await react('createForPullRequestReviewComment', p.comment.id, 'comment_id');
              else if (context.eventName === 'issues')
                await react('createForIssue', p.issue.number, 'issue_number');
              else if (context.eventName === 'pull_request_review')
                await react('createForIssue', p.pull_request.number, 'issue_number');
            } catch (e) { core.info('reaction skipped: ' + e.message); }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # Native deps so Claude can actually build and run the test suite
      # (turbovec links CBLAS via OpenBLAS on Linux).
      - name: Install OpenBLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config

      - id: claude
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        env:
          # gh CLI authenticates as the turbovec-bot machine account.
          GH_TOKEN: ${{ secrets.CLAUDE_BOT_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Run as the turbovec-bot Write collaborator (not the Claude App):
          # its own identity, contributor-level, and not in CODEOWNERS — so it
          # can't approve, and merges to main stay gated on the owner's review.
          github_token: ${{ secrets.CLAUDE_BOT_TOKEN }}
          # The action's own mention-detection defaults to "@claude"; keep it
          # in sync with the actor-guard trigger above.
          trigger_phrase: "@q-turbovec-bot"
          # Full local-parity toolset: arbitrary shell (build/test/gh/etc.),
          # file edits, and web access. Safe because this workflow is
          # owner-only (see the actor guard above) — do NOT widen the guard
          # while these tools are enabled.
          claude_args: |
            --model claude-fable-5
            --max-turns 100
            --allowedTools "Bash,Edit,Write,Read,Grep,Glob,LS,WebSearch,WebFetch,Task,TodoWrite"

      # Reflect the outcome: 🚀 on success, 😕 on failure. The 👀 stays,
      # so the reaction row reads like a ticket: seen → resolved.
      - name: React with result
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const content = '${{ steps.claude.outcome }}' === 'success' ? 'rocket' : 'confused';
            const p = context.payload, o = context.repo.owner, r = context.repo.repo;
            const react = (fn, id, key) =>
              github.rest.reactions[fn]({ owner: o, repo: r, [key]: id, content });
            try {
              if (context.eventName === 'issue_comment')
                await react('createForIssueComment', p.comment.id, 'comment_id');
              else if (context.eventName === 'pull_request_review_comment')
                await react('createForPullRequestReviewComment', p.comment.id, 'comment_id');
              else if (context.eventName === 'issues')
                await react('createForIssue', p.issue.number, 'issue_number');
              else if (context.eventName === 'pull_request_review')
                await react('createForIssue', p.pull_request.number, 'issue_number');
            } catch (e) { core.info('reaction skipped: ' + e.message); }
