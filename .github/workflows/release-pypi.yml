name: Release (PyPI)

on:
  push:
    tags:
      - "py-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.target }}
    # Build each target on a runner of its own architecture, so the build
    # is native and the in-container `apt-get install libopenblas-dev`
    # picks up the right openblas variant without cross-compile gymnastics.
    runs-on: ${{ matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: manylinux_2_28
          args: --release --out dist
          working-directory: turbovec-python
          before-script-linux: |
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y openblas-devel openssl-devel pkgconfig
            elif command -v yum >/dev/null 2>&1; then
              yum install -y openblas-devel openssl-devel pkgconfig
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y libopenblas-dev libssl-dev pkg-config
            else
              echo "No supported package manager found" && exit 1
            fi
      # Install the freshly-built wheel and run the core test suite on
      # the runner (outside the build container). This catches linkage
      # regressions that produce structurally-correct .so files which
      # fail at Python import time — exactly the class of bug that was
      # silently shipping in Linux wheels until this PR.
      - name: Install wheel and smoke test
        shell: bash
        working-directory: turbovec-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install dist/*.whl
          python -m pytest tests/ -v
      # The wheel is abi3-py39: a single artifact claims Python 3.9-3.14,
      # but only 3.11 is exercised above. Import-test the same wheel on
      # the floor (3.9) and ceiling (3.14) of the claimed range, where
      # limited-API breakage hides. Runs the smoke tests when numpy
      # publishes wheels for the interpreter; otherwise falls back to an
      # import-only check of the extension module.
      - name: Set up Python 3.9 and 3.14
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.9
            3.14
      - name: Smoke test abi3 wheel on 3.9 and 3.14
        shell: bash
        working-directory: turbovec-python
        run: |
          set -euo pipefail
          for py in 3.9 3.14; do
            venv="${RUNNER_TEMP}/venv-${py}"
            "python${py}" -m venv "$venv"
            "$venv/bin/python" -m pip install --upgrade pip
            if "$venv/bin/python" -m pip install --only-binary numpy pytest dist/*.whl; then
              "$venv/bin/python" -m pytest tests/ -v
            else
              echo "numpy has no wheel for Python ${py}; falling back to import-only check"
              "$venv/bin/python" -m pip install --no-deps dist/*.whl
              "$venv/bin/python" -c "import turbovec; print('imported turbovec on', __import__('sys').version)"
            fi
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: turbovec-python/dist

  macos:
    name: macOS aarch64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist
          working-directory: turbovec-python
      # Same rationale as the linux job: install the freshly-built wheel
      # and run the test suite so linkage regressions that only surface at
      # Python import time can't ship in the macOS wheel.
      - name: Install wheel and smoke test
        shell: bash
        working-directory: turbovec-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install dist/*.whl
          python -m pytest tests/ -v
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: turbovec-python/dist

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
          working-directory: turbovec-python
      - name: Install wheel and run tests
        shell: bash
        working-directory: turbovec-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install dist/*.whl
          python -m pytest tests/ -v
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: turbovec-python/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: turbovec-python
      # Install from the tarball to prove the sdist actually builds from
      # source — a tarball missing files (Rust sources, path deps, build
      # scripts) would otherwise ship green and break exactly the users
      # who have no matching wheel. Rust is preinstalled on GitHub ubuntu
      # runners; openblas is needed for the native build.
      - name: Install openblas for source build
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config
      - name: Install sdist from source and smoke test
        shell: bash
        working-directory: turbovec-python
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install dist/*.tar.gz
          python -m pytest tests/ -v
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: turbovec-python/dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/py-v')
    environment:
      name: pypi
      url: https://pypi.org/project/turbovec
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
