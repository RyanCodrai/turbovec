name: Re-run review

# Turns the `Re-run review` button on an `Agent code review` check back into a
# review. The button exists because that gate is a check run rather than a
# commit status (#472): check runs carry up to three `actions`, and pressing
# one fires `check_run` with action `requested_action`, which is what this
# workflow listens for. Without it the button would render and do nothing.
#
# This is a dispatcher and nothing else. It starts pr-review.yml through its
# `workflow_dispatch` input and stops there, so the review itself keeps one
# definition, one concurrency group, and one set of guards.
#
# Two GitHub behaviours shape this file:
#
#   1. `check_run` workflows always run from the DEFAULT BRANCH, never from
#      the PR head. So this cannot be tested on the pull request that adds
#      it — the first real exercise is after it lands on main. It also means
#      the version of this file that runs is always main's, whatever the PR
#      under review contains.
#   2. Events authored by GITHUB_TOKEN do not start workflow runs. The
#      dispatch below therefore uses CLAUDE_BOT_TOKEN, or it would post a
#      `workflow_dispatch` that silently never runs. That is the same reason
#      pr-review.yml writes its PR comment with GITHUB_TOKEN and not the PAT —
#      the property is being used in both directions on purpose.

on:
  check_run:
    types: [requested_action]

permissions: {}

jobs:
  rerun:
    # Identity of the button, not just its label: `identifier` is what the
    # check run declared, so a different button on a different check cannot
    # reach this. The name is pinned too, because `rerun-review` is only
    # meaningful on the review gate.
    #
    # GitHub renders requested-action buttons only to users with write
    # access, and `requested_action` events are generated by that UI rather
    # than by the API, so the press is already privileged. The actor id is
    # pinned anyway, matching claude.yml and pr-review.yml: reviews spend
    # subscription usage, and every other entry point into that spend is
    # guarded the same way (RyanCodrai = 10856497).
    if: |
      github.event.requested_action.identifier == 'rerun-review' &&
      github.event.check_run.name == 'Agent code review' &&
      github.actor_id == '10856497'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Start a review of the pull request
        env:
          # PAT, deliberately — see note 2 in the header.
          GH_TOKEN: ${{ secrets.CLAUDE_BOT_TOKEN }}
          # A check run carries the PRs its head SHA belongs to. Same-repo
          # heads always populate it; a fork head does not, which is fine
          # because the review refuses fork heads anyway.
          PR: ${{ github.event.check_run.pull_requests[0].number }}
          SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "${PR:-}" ]; then
            echo "::error::no pull request is attached to check run on $SHA"
            exit 1
          fi
          echo "re-running the review of #$PR ($SHA)"
          gh workflow run pr-review.yml --repo "$GITHUB_REPOSITORY" -f pr="$PR"
