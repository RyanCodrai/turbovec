name: Summarize command

# Instant counterpart to eyes-summary.yml: commenting `/summary` on an
# issue, or on a pull request (conversation or inline review comment),
# posts a plain-English summary of it within seconds, because comments —
# unlike reactions, which GitHub emits no event for — fire a webhook
# the moment they're created.
#
# `/summary` is distinct from claude.yml's `@q-turbovec-bot` and
# pr-review.yml's `/review`, so no two workflows fire on one comment.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  summarize:
    # Owner-only, same immutable actor-id guard as claude.yml — the OAuth
    # token spends subscription usage (RyanCodrai = 10856497).
    # No pull-request test here: `/summary` works on issues too, so the
    # only gates are who asked and what they said. `issue_comment` fires
    # for issues and pull requests alike; the step below picks the right
    # `gh` subcommand from `github.event.issue.pull_request`, which is
    # null on an issue and an object on a pull request.
    if: |
      github.actor_id == '10856497' &&
      startsWith(github.event.comment.body, '/summary')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # 👀 ack reaction on the trigger comment
      pull-requests: read
    steps:
      # Acknowledge immediately so the command is visibly "seen".
      - name: React 👀 (acknowledge)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const fn = context.eventName === 'issue_comment'
              ? 'createForIssueComment' : 'createForPullRequestReviewComment';
            try {
              await github.rest.reactions[fn]({
                owner, repo, comment_id: context.payload.comment.id, content: 'eyes',
              });
            } catch (e) { core.info('reaction skipped: ' + e.message); }

      # persist-credentials: false — the agent below reads PR diffs and comments,
      # i.e. third-party-writable content, so no git credential should be sitting
      # in .git/config. Nothing here pushes: the summary is posted with `gh`,
      # authenticated by GH_TOKEN.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Optional length overrides: `/summary para 3`, `/summary words 150`,
      # or both in either order. Anything else after `/summary` is ignored,
      # so the bare command keeps working exactly as before.
      #
      # The comment body arrives through `env`, never interpolated into the
      # script. A comment body is a template-injection sink even behind the
      # owner-id guard, and zizmor gates this workflow on that rule.
      #
      # Both counts are range-checked rather than passed through: an
      # out-of-range or malformed number falls back to the default instead
      # of asking the model for 900 paragraphs.
      - name: Parse requested length
        id: length
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          num() {
            printf '%s' "$BODY" \
              | grep -oiE "\\b$1[[:space:]]+[0-9]{1,4}\\b" \
              | head -1 | grep -oE '[0-9]+' || true
          }
          paras=$(num 'para(graph)?s?')
          words=$(num 'words?')

          out=""
          if [ -n "$paras" ] && [ "$paras" -ge 1 ] && [ "$paras" -le 10 ]; then
            if [ "$paras" -eq 1 ]; then
              out="Write exactly one paragraph."
            else
              out="Write exactly $paras paragraphs."
            fi
          fi
          if [ -n "$words" ] && [ "$words" -ge 10 ] && [ "$words" -le 2000 ]; then
            out="${out:+$out }Keep it to roughly $words words."
          fi
          [ -n "$out" ] || out="Use the skill's default length."

          echo "instruction=$out" >> "$GITHUB_OUTPUT"
          echo "requested: $out"

      - name: Summarize and comment
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        env:
          # gh CLI authenticates as the turbovec-bot machine account, so
          # the summary is posted under its identity like other bot comments.
          GH_TOKEN: ${{ secrets.CLAUDE_BOT_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_BOT_TOKEN }}
          prompt: |
            The repository owner commented `/summary` on
            ${{ (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) && 'pull request' || 'issue' }}
            #${{ github.event.issue.number || github.event.pull_request.number }},
            requesting a plain-English summary of it.

            1. Study it as it stands right now, using the commands for
               whichever kind it is:
               - pull request: `gh pr view N`, `gh pr diff N`,
                 `gh pr view N --comments`
               - issue: `gh issue view N`, `gh issue view N --comments`
            2. Write the summary by following the /summarize skill
               (.claude/skills/summarize/SKILL.md), which covers issues and
               pull requests alike.
            3. Length: ${{ steps.length.outputs.instruction }}
               This came from the command itself, so it overrides the
               skill's default length. Everything else in the skill — plain
               English, no headers or bullets, no hype — still applies.
            4. Post it with `gh pr comment N --body ...` on a pull request,
               or `gh issue comment N --body ...` on an issue.

            Read-only otherwise: do not push commits, edit files, or touch
            anything beyond posting the summary comment.
          claude_args: |
            --model claude-fable-5
            --max-turns 40
            --allowedTools "Bash,Read,Grep,Glob,LS,Skill,TodoWrite"
