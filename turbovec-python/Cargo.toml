[package]
name = "turbovec-python"
version = "0.8.0"
edition = "2021"
# Kept in lockstep with turbovec's `rust-version` — the `msrv` leg in ci.yml
# fails if the two manifests disagree. The rationale for the number, and why
# an aarch64 build makes it look over-declared, is recorded in
# `turbovec/Cargo.toml`. pyo3 and numpy declare 1.83, so this crate's own
# dependencies do not raise the floor; the AVX-512 kernels in turbovec do.
rust-version = "1.89"

[lib]
name = "_turbovec"
crate-type = ["cdylib"]

[features]
# On by default, so `cargo build`, clippy and maturin (which also passes
# `pyo3/extension-module` explicitly, see pyproject.toml) are unaffected.
# It exists as a feature only so it can be switched *off*: with it on, pyo3
# emits no libpython link line, which is right for a dynamically-loaded
# `.so` and wrong for anything that has to link — the crate's own lib tests
# then fail to link against `Py_IncRef`/`_Py_NoneStruct` (they happen to
# link in a debug profile only because dead-stripping drops the references,
# and not under `--release`, where LTO keeps them). CI runs those tests as
# `--no-default-features` against the interpreter `setup-python` provides.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
turbovec-core = { package = "turbovec", path = "../turbovec" }
pyo3 = { version = "0.29.0", features = ["abi3-py39"] }
numpy = "0.29.0"
# Same major as the core's dep, so both resolve to one rayon-core and the
# process-local pool `with_pool` installs is the pool the kernels use.
# Floor raised to 1.12 (issue #147): the fork-safe nq==1 inline fast path
# relies on rayon's length-1 parallel bridge folding on the calling thread
# without entering the pool. That is a rayon-internal behavior, not a
# documented guarantee, verified on 1.12; `test_nq1_no_split` guards it and
# `Cargo.lock` + `--locked` pin the exact patch in CI/release.
rayon = "1.12"

# pthread_atfork belt-and-suspenders fork detector (Unix only). The
# authoritative detector is Python's os.register_at_fork; pthread_atfork
# additionally catches forks issued by non-Python native code.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
pyo3-build-config = "0.29.0"
