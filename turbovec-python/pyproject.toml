[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "turbovec"
version = "0.8.0"
description = "Fast vector quantization with 2-4 bit compression and SIMD search"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ryan Codrai" },
]
keywords = [
    "vector-search",
    "quantization",
    "nearest-neighbor",
    "ann",
    "simd",
    "rag",
    "embeddings",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]

dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/RyanCodrai/turbovec"
Repository = "https://github.com/RyanCodrai/turbovec"
Issues = "https://github.com/RyanCodrai/turbovec/issues"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llama-index = ["llama-index-core>=0.12.1"]
haystack = ["haystack-ai>=2.23.0"]
agno = ["agno>=2.5.4"]

[tool.maturin]
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "turbovec._turbovec"
# `python-source` copies the directory verbatim, so a maintainer's working
# checkout would otherwise ship untracked build residue: stale per-version
# `__pycache__` bytecode inside an abi3 3.9-3.14 wheel, and a phantom
# `turbovec.mlx` namespace package left behind by deleted sources (#305).
# The compiled extension is produced by maturin itself and injected after
# this copy, so `**/*.so` does not exclude `_turbovec.abi3.so`.
exclude = ["**/__pycache__/**", "**/*.so", "**/*.dSYM/**"]
