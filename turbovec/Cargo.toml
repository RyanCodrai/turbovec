[package]
name = "turbovec"
version = "1.0.0"
edition = "2021"
# 1.89 is a floor the code actually needs, not a rounded-up default, and it has
# now been reported as over-declared twice (#351). The AVX-512 search kernel is
# what sets it: `search.rs` gates functions on `target_feature(enable =
# "avx512f" / "avx512bw")` and `search.rs`/`rotation.rs` call `_mm512_*`
# intrinsics, all of which were unstable (`stdarch_x86_avx512`) until 1.89 —
# and two changed signature at stabilization (`_mm512_loadu_si512` takes
# `*const i32`, `_mm512_i32gather_ps` a `*const u8` base).
#
# Measured with `cargo check -p turbovec --target x86_64-unknown-linux-gnu
# --locked --all-targets`: 1.83 -> 153 errors, 1.88 -> 151 errors, 1.89 ->
# Finished. So 1.89 is the exact minimum; the next release down does not build.
#
# Checking this on an aarch64 host proves nothing, and that is where both
# over-declaration reports came from: those kernels sit behind
# `#[cfg(target_arch = "x86_64")]` and are never compiled on ARM, so
# `cargo +1.83 check -p turbovec --locked --all-targets` finishes cleanly there
# while the same check for x86_64 fails 153 times. Pass `--target
# x86_64-unknown-linux-gnu` explicitly before concluding anything about this
# number. The `msrv` leg in ci.yml builds the declared toolchain on
# ubuntu-latest, so it catches an *under*-declaration; nothing checks the
# release below, which is why an over-declaration would have to be found by
# hand.
rust-version = "1.89"
description = "Fast vector quantization with 2-4 bit compression and SIMD search"
license = "MIT"
repository = "https://github.com/RyanCodrai/turbovec"
homepage = "https://github.com/RyanCodrai/turbovec"
readme = "../README.md"
keywords = ["vector-search", "quantization", "nearest-neighbor", "ann", "simd"]
categories = ["algorithms", "science", "compression"]

[dependencies]
# Kept in lockstep with turbovec-python's floor so both crates resolve to a
# single rayon-core (see that crate's rayon note and issue #147).
rayon = "1.12"
ordered-float = "4"
rand = "0.8"
# Pinned to an exact version: the ChaCha8 byte stream is baked into every
# v5-encoded vector (it drives the block-Hadamard rotation's sign flips and
# permutations). A stream change in a new rand_chacha release would silently
# invalidate every index — the same #206 bug class this format break fixed —
# so the version is frozen and a golden-bytes test guards it.
rand_chacha = "=0.3.1"
# Pinned to an exact version for the same reason as `rand_chacha` above.
# `Beta::cdf` decides two things that reach every encoded byte: the Lloyd-Max
# centroids/boundaries (`codebook::codebook`) and, through them, the TQ+
# calibration anchor (`encode::tqplus_anchor`, #454). `tqplus_shift`/
# `tqplus_scale` are stored in the file and multiply every coordinate before
# coding, so any 0.17.x patch release that moves `cdf` — or the `ln`/`exp` it
# bottoms out in — would change encoded bytes: a non-breaking-looking upstream
# change that silently invalidates existing indexes.
#
# The pin was originally taken for `Beta::inverse_cdf`, which `Beta` does not
# override (it got the trait default in `distribution/mod.rs`, a fixed 16-step
# bisection on `[-2, 2]`) — a specialising patch release moved the calibration
# and nothing failed (#346). Since #454 the anchor comes from the codebook
# directly and production code no longer calls `inverse_cdf` at all, so the
# exposure moved to `cdf` rather than going away. The pin is still required.
# `tests/encode_fingerprint.rs` pins the resulting bytes; this pin stops the
# input from moving under it unasked.
statrs = "=0.17.1"

[features]
# Debug/test telemetry: count 32-vector blocks short-circuited by the
# slot-mask early exit. Off by default — the per-skip atomic RMW on a
# shared cache line serializes the masked search hot loop (#294).
mask-skip-counter = []

[dev-dependencies]
# Self dev-dependency so `cargo test` still exercises the block-skip
# activation test without the counter existing in release builds.
turbovec = { path = ".", features = ["mask-skip-counter"] }
