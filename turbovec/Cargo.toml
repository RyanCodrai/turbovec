[package]
name = "turbovec"
version = "0.9.0"
edition = "2021"
rust-version = "1.89"
description = "Fast vector quantization with 2-4 bit compression and SIMD search"
license = "MIT"
repository = "https://github.com/RyanCodrai/turbovec"
homepage = "https://github.com/RyanCodrai/turbovec"
readme = "../README.md"
keywords = ["vector-search", "quantization", "nearest-neighbor", "ann", "simd"]
categories = ["algorithms", "science", "compression"]

[dependencies]
# Kept in lockstep with turbovec-python's floor so both crates resolve to a
# single rayon-core (see that crate's rayon note and issue #147).
rayon = "1.12"
ordered-float = "4"
rand = "0.8"
# Pinned to an exact version: the ChaCha8 byte stream is baked into every
# v5-encoded vector (it drives the block-Hadamard rotation's sign flips and
# permutations). A stream change in a new rand_chacha release would silently
# invalidate every index — the same #206 bug class this format break fixed —
# so the version is frozen and a golden-bytes test guards it.
rand_chacha = "=0.3.1"
statrs = "0.17"

[features]
# Debug/test telemetry: count 32-vector blocks short-circuited by the
# slot-mask early exit. Off by default — the per-skip atomic RMW on a
# shared cache line serializes the masked search hot loop (#294).
mask-skip-counter = []

[dev-dependencies]
# Self dev-dependency so `cargo test` still exercises the block-skip
# activation test without the counter existing in release builds.
turbovec = { path = ".", features = ["mask-skip-counter"] }
